# Drop this into .github/workflows/ of any repository you want scanned.
#
# One-time setup in that repository:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: LLM_API_KEY   Value: your provider key
#
# Results land in the repository's Security tab (Code scanning alerts) and,
# on a pull request, as inline annotations on the changed lines.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Required to publish SARIF into the Security tab. Without this the scan
  # still runs, but the results have nowhere to go.
  security-events: write

jobs:
  credhunter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nipuni-udari/CredHunter_X@v1
        with:
          # Your provider and model. Any litellm "provider/model" string works
          # -- openai/..., anthropic/..., gemini/..., a self-hosted endpoint.
          llm-model: <provider>/<model>

          # Your key, stored as a secret in this repository under any name.
          llm-api-key: ${{ secrets.LLM_API_KEY }}

          # Optional -- shown here with their defaults.
          # path: '.'
          # mode: agentic               # or "single": one call per candidate, cheaper
          # llm-reasoning-effort: medium
          # fail-on-secret: 'true'      # 'false' to report without blocking the merge
          # sarif-file: credhunter-x.sarif
          # html-file: credhunter-x.html
