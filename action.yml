name: 'CredHunter-X'
description: 'LLM-assisted secret scanning: GitLeaks + TruffleHog candidates, triaged by an LLM, published as SARIF.'
author: 'Nipuni Udari Rajapaksha Weeraman'

branding:
  icon: 'key'
  color: 'purple'

inputs:
  path:
    description: 'Directory to scan, relative to the workspace.'
    required: false
    default: '.'
  llm-model:
    description: 'litellm-style provider/model string, e.g. "openai/gpt-4o-mini".'
    required: true
  llm-api-key:
    description: 'API key for the model provider. Pass a repository secret, never a literal.'
    required: true
  mode:
    description: 'Classifier arm, "agentic" (default, more thorough) or "single" (one call per candidate, cheaper). Leave empty to use the scanned repo''s own .secretscan.yml.'
    required: false
    default: 'agentic'
  llm-reasoning-effort:
    description: 'Reasoning effort for reasoning-capable models. Empty leaves the model''s own default in place.'
    required: false
    default: 'medium'
  sarif-file:
    description: 'Where to write the SARIF report.'
    required: false
    default: 'credhunter-x.sarif'
  html-file:
    description: 'Where to write the HTML report. Empty string disables it.'
    required: false
    default: 'credhunter-x.html'
  upload-sarif:
    description: 'Publish the SARIF to GitHub code scanning. Needs permissions: security-events: write.'
    required: false
    default: 'true'
  upload-html:
    description: 'Upload the HTML report as a workflow artifact.'
    required: false
    default: 'true'
  fail-on-secret:
    description: 'Fail the job on a true secret, or on any candidate that could not be classified.'
    required: false
    default: 'true'
  python-version:
    description: 'Python used to run the scanner.'
    required: false
    default: '3.12'
  gitleaks-version:
    description: 'GitLeaks release to install.'
    required: false
    default: '8.18.4'
  trufflehog-version:
    description: 'trufflehog3 release to install.'
    required: false
    default: '3.0.10'

outputs:
  sarif-file:
    description: 'Path to the SARIF report that was written.'
    value: ${{ inputs.sarif-file }}
  exit-code:
    description: 'Scanner exit code: 0 clean, 1 a secret was found or a candidate was skipped.'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install detectors
      shell: bash
      # Both pinned: an unpinned detector would silently change what reaches
      # the classifier between runs.
      run: |
        set -euo pipefail
        v="${{ inputs.gitleaks-version }}"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
        curl -sSfL "$url" | tar -xz gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "trufflehog3==${{ inputs.trufflehog-version }}"
        gitleaks version
        trufflehog3 --version

    - name: Install CredHunter-X
      shell: bash
      # Installed from the action's own checkout, so no PyPI release is needed.
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Select classifier arm
      if: inputs.mode != ''
      shell: bash
      # The CLI reads .secretscan.yml from the working directory; treatment is
      # not user-configurable there and always stays masked.
      run: |
        echo "mode: ${{ inputs.mode }}" > "${{ github.workspace }}/.secretscan.yml"

    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_REASONING_EFFORT: ${{ inputs.llm-reasoning-effort }}
        GITLEAKS_BINARY_PATH: gitleaks
        TRUFFLEHOG_BINARY_PATH: trufflehog3
      # Never fails here -- the exit code is enforced at the end, so the SARIF
      # still gets published when a secret is found.
      run: |
        set +e
        args=("${{ inputs.path }}" --sarif "${{ inputs.sarif-file }}")
        if [ -n "${{ inputs.html-file }}" ]; then
          args+=(--html "${{ inputs.html-file }}")
        fi
        credhunter-x "${args[@]}"
        code=$?
        set -e
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"

    - name: Publish to code scanning
      if: always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: credhunter-x

    - name: Upload HTML report
      if: always() && inputs.upload-html == 'true' && inputs.html-file != '' && hashFiles(inputs.html-file) != ''
      uses: actions/upload-artifact@v4
      with:
        name: credhunter-x-report
        path: ${{ inputs.html-file }}
        if-no-files-found: ignore

    - name: Enforce scan result
      if: always()
      shell: bash
      # Exit 1 is a verdict about the scanned code; anything higher means the
      # scanner itself failed, which must never be reported as a finding.
      run: |
        code="${{ steps.scan.outputs.exit-code }}"
        case "${code:-1}" in
          0)
            ;;
          1)
            echo "::error::CredHunter-X found a secret, or a candidate could not be classified."
            if [ "${{ inputs.fail-on-secret }}" = "true" ]; then exit 1; fi
            ;;
          *)
            echo "::error::CredHunter-X failed to run (exit ${code}) -- a tool or configuration error, not a finding in your code."
            exit 1
            ;;
        esac
