name: Release

on:
  push:
    tags: ['v*']
  # Lets an existing tag get a release page after the fact -- run this
  # workflow from the Actions tab and give it the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.8'
        required: true

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # release notes are generated by comparing tags

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build the wheel and sdist
        run: uv build

      - name: Check the build is installable and carries its metadata
        run: |
          set -euo pipefail
          uv run --with twine twine check dist/*
          ls -la dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CredHunter-X ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
