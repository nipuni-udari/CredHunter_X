name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Pinned by tag, not /latest/. The latest release does not contain a
      # file named for an older version, so /latest/ 404s the day gitleaks
      # ships a new one -- with no commit here to explain it.
      #
      # trufflehog3 gets its own venv: it pins attrs==20.3.0 and jinja2==3.1.4,
      # which litellm cannot live with. Only its binary needs to be reachable.
      - name: Install detectors
        run: |
          set -euo pipefail
          V=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          python3 -m venv "$HOME/.th"
          "$HOME/.th/bin/pip" install --quiet "trufflehog3==3.0.10"
          echo "$HOME/.th/bin" >> "$GITHUB_PATH"
          gitleaks version
          "$HOME/.th/bin/trufflehog3" --version

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -m "not live" --cov=credhunter_x

      - name: Scan repo for secrets
        run: gitleaks detect --source . --no-git -v
