[project]
name = "credhunter-x"
version = "0.1.0"
description = "LLM-assisted secret detection and explanation for Python source code, with a privacy-preserving masking layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "openai>=3.2.0",
    "litellm>=1.83.0",
]

[project.scripts]
credhunter-x = "credhunter_x.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credhunter_x"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "scipy-stubs>=1.17.1.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["credhunter_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that make real LLM API calls (excluded by default)",
]
addopts = "-m 'not live'"
